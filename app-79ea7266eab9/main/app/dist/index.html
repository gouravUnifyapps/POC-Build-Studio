<!doctype html>
<!-- `dir` is required, not cosmetic: the design system's `ltr:` / `rtl:` Tailwind variants
     compile to `:where([dir="ltr"], …)`, so with no `dir` in the document every
     direction-aware rule silently no-ops — including the one that positions copilot message
     avatars, which then land on top of the message text.

     These two attributes are the FIRST-PAINT values only. `I18nProvider` (src/lib/i18n)
     rewrites both from `src/i18n/languages.json` as soon as React mounts, so an app that
     ships more than one language does not need them changed. Do keep them in step with the
     default language: what is written here is what the user sees for one frame. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./unifyapps-app-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC Studio Live</title>
    <!-- The app's Content-Security-Policy. Filled in the BUILD output only (the engine's
         csp.bake_meta, and tensor when it serves a published app) — it stays empty here
         because the policy is configured by the app's owner on the platform, not written
         in code, and a snapshot of it committed to this file would go stale silently.
         Empty in report-only mode too: a meta tag has no report-only form. -->
    <!-- ua:csp --><!-- /ua:csp -->
    <!-- ua:theme-font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" />
    <!-- /ua:theme-font -->
    <!-- The UnifyApps · POC Studio design system faces: Spectral and IBM Plex Mono. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <script type="module" crossorigin src="./assets/index-DjP4NtuN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DJ-PFji_.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
